name: CI/CD

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirement.txt
          pip install pytest

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps

      - name: Create .env file
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "GOOGLE_CREDENTIALS_PATH=chatbotkpi-491800-2ff5e01549b5.json" >> .env
          echo "APP_ENV=test" >> .env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=60" >> .env
          echo "CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}" >> .env
          echo "CORS_ORIGIN_REGEX=${{ secrets.CORS_ORIGIN_REGEX }}" >> .env
          echo "REFRESH_SECRET_KEY=${{ secrets.REFRESH_SECRET_KEY }}" >> .env
          echo "REFRESH_TOKEN_EXPIRE_DAYS=7" >> .env
          echo "RESET_SECRET_KEY=${{ secrets.RESET_SECRET_KEY }}" >> .env
          echo "AUTH_ALGORITHM=HS256" >> .env
          echo "AUTH_TOKEN_TYPE=bearer" >> .env
          echo "AUTH_REFRESH_TOKEN_TYPE=refresh" >> .env
          echo "AUTH_RESET_TOKEN_TYPE=reset" >> .env
          echo "AUTH_PIN_EXPIRE_MINUTES=15" >> .env
          echo "AUTH_RESET_TOKEN_EXPIRE_MINUTES=10" >> .env
          echo "SMTP_FROM=Chatbot KPI <chatbotkpi@example.com>" >> .env
          echo "SMTP_HOST=sandbox.smtp.mailtrap.io" >> .env
          echo "SMTP_PORT=587" >> .env
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env
          echo "LLM_MODEL_API_KEY=${{ secrets.LLM_MODEL_API_KEY }}" >> .env
          echo "LLM_MODEL_BASE_URL=${{ secrets.LLM_MODEL_BASE_URL }}" >> .env
          echo "LLM_MODEL_NL_TO_SQL=openai/gpt-4o" >> .env
          echo "LLM_MODEL_ANALYSIS=openai/gpt-4o" >> .env
          echo "LLM_MODEL_DISAMBIGUATION=openai/gpt-4o-mini" >> .env
          echo "LLM_MODEL_GRAPHIC_CLASSIFIER=openai/gpt-4o-mini" >> .env
          echo "LLM_MODEL_OUT_SCOPE_CLASSIFIER=openai/gpt-4o-mini" >> .env
          echo "RATE_LIMIT_PER_MINUTE=30" >> .env
          echo "SQL_MAX_LIMIT=5000" >> .env
          echo "SQL_MAX_SUBQUERY_DEPTH=3" >> .env
          echo "SQL_EXECUTION_TIMEOUT=30" >> .env

      - name: Run tests
        run: |
          pytest

  build-and-push-image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Build & Push
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest .
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy ECS
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --force-new-deployment