- id: team_kpi_progress_against_target
  question: "KPI tim saya yang realisasinya sudah mencapai target atau mendekati target sampai bulan terakhir apa saja? Tolong sertakan progress dan keterangannya."
  user_role: "kepala_divisi"
  user_divisi: null
  user_email: "rina.kadiv@kpiapp.id"
  expected_sql: >
    SELECT kt.bulan_num, km.kpi_name, kt.realisasi, km.target, km.achieve, km.partial, km.fail, kt.keterangan
    FROM kpi_tracker_records kt
    JOIN kpi_master_records km ON kt.kpi_master_id = km.id
    WHERE kt.bulan_num = (SELECT MAX(bulan_num) FROM kpi_tracker_records)
    ORDER BY kt.bulan_num DESC, km.kpi_name;
  expected_answer: "Pada bulan terakhir, KPI yang ditampilkan adalah Internal Enablement dengan realisasi 3 dan target 3, Product Readiness dengan realisasi TRL 7 dan target TRL 7, serta Product Launch dengan realisasi 3 dan target 3. Ketiganya memiliki keterangan progress bulan terakhir, termasuk Internal Enablement: ACHIEVE dan Product Readiness: ACHIEVE."
  expected_context:
    tables:
      - kpi_tracker_records
      - kpi_master_records
    columns:
      - kpi_tracker_records.bulan_num
      - kpi_tracker_records.kpi_master_id
      - kpi_tracker_records.realisasi
      - kpi_tracker_records.keterangan
      - kpi_master_records.id
      - kpi_master_records.kpi_name
      - kpi_master_records.target
      - kpi_master_records.achieve
      - kpi_master_records.partial
      - kpi_master_records.fail
  notes: "Kepala divisi performance review for KPI progress against target thresholds."

